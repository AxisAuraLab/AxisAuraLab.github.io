<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AxisAura Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 40px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        .logo {
            font-family: 'Caveat', cursive;
            font-size: 38px;
            font-weight: 700;
            color: #d4af37;
            text-decoration: none;
            transform: rotate(-4deg);
            display: inline-block;
            transition: color 0.3s ease;
        }

        .logo:hover {
            color: #f0c75e;
        }

        .menu-icon {
            width: 35px;
            height: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .menu-icon span {
            display: block;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
            transition: background-color 0.3s ease;
        }

        .menu-icon:hover span {
            background-color: #d4af37;
        }
    </style>
</head>
<body>

    <header>
        <a href="about.html" class="logo">AxisAura Lab</a>
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

</body>
</html>
