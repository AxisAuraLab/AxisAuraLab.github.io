<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AxisAura Lab — Контакты</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 30px;
            text-align: center;
        }

        h1 {
            font-family: 'Caveat', cursive;
            font-size: 64px;
            font-weight: 700;
            color: #d4af37;
            transform: rotate(-4deg);
            margin-bottom: 40px;
        }

        .subtitle {
            font-size: 20px;
            color: #ffffff;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        .email {
            font-size: 26px;
            color: #d4af37;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s ease;
        }

        .email:hover {
            border-bottom: 1px solid #d4af37;
        }
    </style>
</head>
<body>

    <h1>Свяжитесь с нами</h1>

    <p class="subtitle">По вопросам сотрудничества</p>

    <a href="mailto:AxisAura@outlook.com" class="email">AxisAura@outlook.com</a>

</body>
</html>
