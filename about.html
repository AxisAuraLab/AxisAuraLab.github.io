<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AxisAura Lab — Цитаты</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Caveat', cursive;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 30px;
            text-align: center;
        }

        h1 {
            font-size: 64px;
            font-weight: 700;
            color: #d4af37;
            transform: rotate(-4deg);
            margin-bottom: 80px;
        }

        .quotes {
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 50px;
        }

        .quote {
            font-size: 34px;
            line-height: 1.4;
        }

        .quote.white {
            color: #ffffff;
        }

        .quote.gold {
            color: #d4af37;
        }

        .quote::before {
            content: "“";
            font-size: 60px;
            vertical-align: middle;
            margin-right: 10px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h1>AxisAura Lab</h1>

        <div class="quotes">

        <div class="quote white">
            Иван Васильевич менял профессию. Мы меняем физику))
        </div>

        <div class="quote gold">
            Наши данные не летят — они телепортируются
        </div>

        <div class="quote white">
            Как тебе такое, Билл?)
        </div>

        <div class="quote gold">
            Биты, байты — вчера. Atom-Axis — сегодня
        </div>

    </div>
