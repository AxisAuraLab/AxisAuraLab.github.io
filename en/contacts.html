<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AxisAura Lab — Contacts</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 30px;
            text-align: center;
        }

        h1 {
            font-family: 'Caveat', cursive;
            font-size: 64px;
            font-weight: 700;
            color: #d4af37;
            transform: rotate(-4deg);
            margin-bottom: 40px;
        }

        .subtitle {
            font-size: 20px;
            color: #ffffff;
            margin-bottom: 50px;
            opacity: 0.85;
        }

        .email {
            font-family: 'Caveat', cursive;
            font-size: 32px;
            color: #d4af37;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s ease, color 0.3s ease;
            margin-bottom: 40px;
            display: inline-block;
        }

        .email:hover {
            border-bottom: 1px solid #d4af37;
            color: #f0c75e;
        }

        .orcid {
            font-family: 'Caveat', cursive;
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 60px;
            opacity: 0.8;
        }

        .orcid a {
            color: #d4af37;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .orcid a:hover {
            color: #f0c75e;
        }

        .back {
            font-family: 'Caveat', cursive;
            font-size: 28px;
            font-weight: 700;
            color: #d4af37;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: color 0.3s ease;
        }

        .back:hover {
            color: #f0c75e;
        }

        .back .arrow {
            font-size: 34px;
            display: inline-block;
            transform: rotate(-15deg);
        }
    </style>
</head>
<body>

    <h1>Contact Us</h1>

    <p class="subtitle">For cooperation and partnership</p>

    <a href="mailto:AxisAura@outlook.com" class="email">AxisAura@outlook.com</a>

    <p class="orcid">
        ORCID: <a href="https://orcid.org/0009-0002-5298-143X" target="_blank">0009-0002-5298-143X</a>
    </p>

    <a href="index.html" class="back">
        <span class="arrow">←</span>
        <span>Back to Home</span>
    </a>

</body>
</html>
